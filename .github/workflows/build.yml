name: Build Universal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Verify wrapper files exist
        run: |
          test -f gradlew || { echo "ERROR: gradlew missing"; exit 1; }
          test -f gradlew.bat || { echo "ERROR: gradlew.bat missing"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "ERROR: gradle-wrapper.jar missing"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.properties || { echo "ERROR: gradle-wrapper.properties missing"; exit 1; }
          echo "All wrapper files present."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify secrets are present
        run: |
          test -n "${{ secrets.KEYSTORE_BASE64 }}" || { echo "ERROR: KEYSTORE_BASE64 missing"; exit 1; }
          test -n "${{ secrets.KEYSTORE_PASSWORD }}" || { echo "ERROR: KEYSTORE_PASSWORD missing"; exit 1; }
          test -n "${{ secrets.KEY_ALIAS }}" || { echo "ERROR: KEY_ALIAS missing"; exit 1; }
          test -n "${{ secrets.KEY_PASSWORD }}" || { echo "ERROR: KEY_PASSWORD missing"; exit 1; }
          echo "All secrets present."

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > bettertube-release.jks
          test -f bettertube-release.jks || { echo "ERROR: keystore decode failed"; exit 1; }
          echo "Keystore decoded successfully."

      - name: Create keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=$PWD/bettertube-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "keystore.properties created."

      - name: Build Release APK
        env:
          JAVA_OPTS: ""
          GRADLE_OPTS: ""
        run: bash ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: BetterTube-Universal-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30