name: Build Universal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0,platforms;android-34'

      - name: Verify gradle wrapper files
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "ERROR: gradle-wrapper.jar missing"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.properties || { echo "ERROR: gradle-wrapper.properties missing"; exit 1; }
          test -f gradlew || { echo "ERROR: gradlew missing"; exit 1; }
          chmod +x gradlew
          echo "Gradle wrapper files verified."

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'bettertube-release.jks'
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=${{ steps.decode_keystore.outputs.filePath }}
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BetterTube-Universal-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
